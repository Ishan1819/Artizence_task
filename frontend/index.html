<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL Match Predictor</title>
    <link rel="stylesheet" href="/frontend/styles.css" />
    <style>
      .nav {
        background-color: #004080;
        padding: 10px;
        text-align: right;
      }

      .nav a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
        font-weight: bold;
      }

      .nav a:hover {
        text-decoration: underline;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #fff;
        border-radius: 50%;
        width: 14px;
        height: 14px;
        display: inline-block;
        margin-right: 8px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="/analytics" target="_blank">View Analytics Dashboard</a>
    </div>

    <div class="container">
      <h1>IPL Match Winner & Score Predictor</h1>

      <!-- Match Prediction Form -->
      <form id="predictionForm">
        <label for="team1">Enter Team 1:</label>
        <input type="text" id="team1" placeholder="Enter Team 1" required />

        <label for="team2">Enter Team 2:</label>
        <input type="text" id="team2" placeholder="Enter Team 2" required />

        <button type="submit">Predict Winner & Score</button>
      </form>

      <!-- Match Result Output -->
      <div class="result" id="result"></div>

      <!-- Match Explanation -->
      <h2>Reasoning & Explanation</h2>
      <div class="explanation" id="explanation"></div>

      <hr />

      <!-- Player Prediction Section -->
      <h2>Player Performance Prediction</h2>
      <form id="playerForm">
        <label for="playerName">Enter Player Name:</label>
        <input type="text" id="playerName" placeholder="Player Name" required />

        <label for="opponentTeam">Enter Opponent Team:</label>
        <input
          type="text"
          id="opponentTeam"
          placeholder="Opponent Team"
          required
        />

        <button type="submit">Predict Player Performance</button>
      </form>

      <!-- Player Result Output -->
      <div class="player-result" id="playerResult"></div>
    </div>

    <script>
      // Match Prediction
      document
        .getElementById("predictionForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const team1 = document.getElementById("team1").value;
          const team2 = document.getElementById("team2").value;

          const resultDiv = document.getElementById("result");
          const explanationDiv = document.getElementById("explanation");
          const predictBtn = e.target.querySelector("button");

          predictBtn.disabled = true;
          predictBtn.innerHTML = `<span class="spinner"></span> Predicting...`;

          resultDiv.innerHTML = "<p>Please wait...</p>";
          explanationDiv.innerHTML = "";

          try {
            const response = await fetch(
              "http://127.0.0.1:8003/predict-winner",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ team1, team2 }),
              }
            );

            const data = await response.json();

            resultDiv.innerHTML = `
            <p><strong>Predicted Winner:</strong> ${data.predicted_winner}</p>
            <p><strong>Team 1:</strong> ${data.team1} - ${
              data.predicted_scores[data.team1] || 0
            } runs</p>
            <p><strong>Team 2:</strong> ${data.team2} - ${
              data.predicted_scores[data.team2] || 0
            } runs</p>
            <p><strong>Estimated Margin:</strong> ${
              data.estimated_margin
            } runs</p>
          `;

            explanationDiv.innerHTML = `
            <p>${data.explanation}</p>
            <p><strong>Win Probability:</strong> ${Math.round(
              data.probability
            )}%</p>
          `;
          } catch (error) {
            resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
          } finally {
            predictBtn.disabled = false;
            predictBtn.innerHTML = "Predict Winner & Score";
          }
        });

      // Player Performance Prediction
      document
        .getElementById("playerForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const playerName = document.getElementById("playerName").value;
          const opponentTeam = document.getElementById("opponentTeam").value;

          const playerResultDiv = document.getElementById("playerResult");
          const playerBtn = e.target.querySelector("button");

          playerBtn.disabled = true;
          playerBtn.innerHTML = `<span class="spinner"></span> Predicting...`;
          playerResultDiv.innerHTML = "<p>Please wait...</p>";

          try {
            const response = await fetch(
              `http://127.0.0.1:8003/predict/player-performance/?player_name=${encodeURIComponent(
                playerName
              )}&opponent_team=${encodeURIComponent(opponentTeam)}`
            );
            const data = await response.json();

            if (data.prediction) {
              playerResultDiv.innerHTML = `
              <p><strong>Prediction for ${data.player} vs ${data.opponent}:</strong></p>
              <p>${data.prediction}</p>
            `;
            } else {
              playerResultDiv.innerHTML = `<p>Error: ${data.error}</p>`;
            }
          } catch (error) {
            playerResultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
          } finally {
            playerBtn.disabled = false;
            playerBtn.innerHTML = "Predict Player Performance";
          }
        });
    </script>
  </body>
</html>
